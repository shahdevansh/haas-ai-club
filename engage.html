<main>

<h1 class="page">Engage</h1>
<p class="lede">Work with the club.</p>

<form class="eform" action="/api/engage" method="post">
  <label class="fl" for="f-name">Name</label>
  <input class="fi" type="text" id="f-name" name="name" required autocomplete="name">
  <label class="fl" for="f-email">Email</label>
  <input class="fi" type="email" id="f-email" name="email" required autocomplete="email">
  <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
  <fieldset class="fr">
    <legend class="fl">I want to</legend>
    <label class="fro"><input type="radio" name="topic" value="propose-event" required> Propose an event</label>
    <label class="fro"><input type="radio" name="topic" value="propose-track"> Propose a track</label>
    <label class="fro"><input type="radio" name="topic" value="request-to-speak"> Request to speak</label>
    <label class="fro"><input type="radio" name="topic" value="propose-sponsorship"> Propose a sponsorship</label>
  </fieldset>
  <label class="fl" for="f-message">Message</label>
  <textarea class="fi" id="f-message" name="message" rows="6" required></textarea>
  <button class="fbtn" type="submit">Send</button>
</form>

<div class="esoc">
  <h2 class="evsec">Follow the Club</h2>
